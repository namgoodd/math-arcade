<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>코딩수학부 웹 아케이드 (Math Arcade)</title>
  <style>
    :root {
      --primary: #3182ce;
      --primary-hover: #2b6cb0;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-sub: #64748b;
      --border-color: #e2e8f0;
      --accent: #ebf8ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding-bottom: 60px;
    }

    /* 헤더 영역 */
    header {
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
      padding: 40px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-sub);
      font-size: 1.05rem;
      max-width: 600px;
      margin: 0 auto;
    }

    .header-stats {
      margin-top: 14px;
      font-size: 0.85rem;
      color: var(--text-sub);
    }
    .header-stats strong { color: var(--primary); }

    /* 탐색 및 필터 컨테이너 */
    .filter-container {
      max-width: 1200px;
      margin: 30px auto 20px;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .category-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: #ffffff;
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text-sub);
    }

    .tab-btn:hover {
      background: var(--accent);
      color: var(--primary);
    }

    .tab-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .search-box input {
      padding: 8px 16px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.95rem;
      width: 240px;
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--primary);
    }

    /* 게임 카드 그리드 */
    .arcade-grid {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 25px;
    }

    .game-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .game-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    .game-card.is-soon {
      border-style: dashed;
      box-shadow: none;
    }
    .game-card.is-soon:hover { transform: none; box-shadow: none; }

    .card-banner {
      height: 140px;
      background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.5rem;
      user-select: none;
      position: relative;
    }
    .card-banner.theme-blue   { background: linear-gradient(135deg, #dbeafe 0%, #93c5fd 100%); }
    .card-banner.theme-dark   { background: linear-gradient(135deg, #1f2937 0%, #0d1117 100%); }
    .card-banner.theme-green  { background: linear-gradient(135deg, #dcfce7 0%, #86efac 100%); }
    .card-banner.theme-soon   { background: #f1f5f9; filter: grayscale(1); opacity: 0.6; }

    .status-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.9);
      color: var(--text-sub);
    }

    .card-content {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 8px;
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #0f172a;
    }

    .card-author {
      font-size: 0.85rem;
      color: var(--text-sub);
      white-space: nowrap;
    }

    .card-desc {
      font-size: 0.92rem;
      color: #475569;
      margin-bottom: 16px;
      flex-grow: 1;
    }

    .tag-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 20px;
    }

    .math-tag {
      background: #f1f5f9;
      color: #475569;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
    }

    .card-actions {
      display: flex;
      gap: 10px;
    }

    .btn-play {
      flex: 1;
      padding: 10px;
      background: var(--primary);
      color: white;
      text-align: center;
      text-decoration: none;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-play:hover {
      background: var(--primary-hover);
    }

    .btn-play:disabled {
      background: #e2e8f0;
      color: #94a3b8;
      cursor: not-allowed;
    }

    .btn-external {
      padding: 10px 14px;
      background: #f1f5f9;
      color: var(--text-main);
      text-decoration: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-external:hover {
      background: #e2e8f0;
    }

    /* 게임 플레이 모달 */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.75);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-backdrop.active {
      display: flex;
    }

    .modal-window {
      background: #ffffff;
      width: 100%;
      max-width: 1280px;
      height: min(860px, 92vh);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    }

    .modal-header {
      padding: 12px 20px;
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .modal-title {
      font-weight: 700;
      font-size: 1.1rem;
    }

    .modal-header-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .modal-newtab {
      font-size: 0.85rem;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 1.5rem;
      line-height: 1;
      cursor: pointer;
      color: var(--text-sub);
    }

    .modal-body {
      flex: 1;
      background: #f4f6f8;
    }

    .modal-body iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>📐 Coding Math Arcade</h1>
    <p>수학적 원리와 알고리즘을 결합하여 제작한 인터랙티브 학습 게임 아카이브입니다.</p>
    <div class="header-stats" id="headerStats"></div>
  </header>

  <div class="filter-container">
    <div class="category-tabs" id="categoryTabs">
      <button class="tab-btn active" data-category="all">전체보기</button>
      <button class="tab-btn" data-category="function">함수/해석</button>
      <button class="tab-btn" data-category="probability">확률/경우의 수</button>
      <button class="tab-btn" data-category="etc">기타</button>
    </div>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="게임명 또는 수학 개념 검색..." />
    </div>
  </div>

  <main class="arcade-grid" id="arcadeGrid"></main>

  <!-- 게임 모달 레이어 -->
  <div class="modal-backdrop" id="gameModal">
    <div class="modal-window">
      <div class="modal-header">
        <span class="modal-title" id="modalTitle">게임 타이틀</span>
        <div class="modal-header-actions">
          <a class="modal-newtab" id="modalNewTab" href="#" target="_blank">새 창에서 열기 ↗</a>
          <button class="modal-close" id="modalCloseBtn" aria-label="닫기">&times;</button>
        </div>
      </div>
      <div class="modal-body">
        <iframe id="gameIframe" src="" allow="autoplay; fullscreen"></iframe>
      </div>
    </div>
  </div>

  <script>
    /**
     * 팀원들의 게임 목록 데이터
     * 새 게임 추가 시 이 배열에 객체 하나만 추가하면 됩니다.
     *
     * status 값
     *   "ready"    : 이 사이트 안에 파일이 있음 → 모달로 바로 플레이
     *   "external" : 외부 사이트(Replit 등)에 있음 → 새 창으로 열기
     *   "soon"     : 아직 제작/통합 중 → 비활성 카드
     *
     * ※ author 칸의 이름은 직접 바꿔주세요!
     */
    const GAMES_DATA = [
      {
        id: "projectile-math",
        title: "이차함수 포격전",
        author: "남윤성",
        category: "function",
        status: "ready",
        icon: "🎯",
        theme: "theme-blue",
        desc: "y = -ax² + bx 의 계수 a, b를 조절해 포물선 궤도를 만들고, 장애물을 넘겨 타깃을 맞히는 탄도 게임입니다. 꼭짓점과 착지점(근)이 실시간으로 계산됩니다.",
        tags: ["#이차함수", "#포물선", "#꼭짓점", "#미분계수"],
        path: "./games/projectile-math/이차함수.html"
      },
      {
        id: "gene-lab",
        title: "유전자 LAB",
        author: "박재영",
        category: "probability",
        status: "ready",
        icon: "🧬",
        theme: "theme-dark",
        desc: "코돈(유전 인자)을 8칸 체인에 배열해 생물의 표현형을 만들고, Math.random()으로 점 돌연변이를 일으켜 서열 보존율을 분석하는 생명과학 융합 시뮬레이터입니다.",
        tags: ["#중복순열", "#확률", "#난수", "#삼각함수", "#생명과학융합"],
        path: "./games/gene-lab/index.html"
      },
      {
        id: "dinosaur-game",
        title: "Dinosaur Game",
        author: "김규형",
        category: "etc",
        status: "external",
        icon: "🦖",
        theme: "theme-green",
        desc: "팀원이 Replit에서 제작한 공룡 게임입니다. Replit 페이지에서 실행됩니다.",
        tags: ["#Replit"],
        path: "https://replit.com/@h2610504/Dinosaur-Game"
      },
      {
        id: "coming-soon",
        title: "새 게임 통합 예정",
        author: "",
        category: "etc",
        status: "soon",
        icon: "🧩",
        theme: "theme-soon",
        desc: "팀원들이 제작 중인 게임이 이곳에 추가될 예정입니다. GAMES_DATA 배열에 항목 하나만 추가하면 카드가 자동으로 생성됩니다.",
        tags: ["#확장가능구조"],
        path: ""
      }
    ];

    const grid = document.getElementById("arcadeGrid");
    const categoryTabs = document.getElementById("categoryTabs");
    const searchInput = document.getElementById("searchInput");
    const headerStats = document.getElementById("headerStats");

    const modal = document.getElementById("gameModal");
    const modalTitle = document.getElementById("modalTitle");
    const modalNewTab = document.getElementById("modalNewTab");
    const gameIframe = document.getElementById("gameIframe");
    const modalCloseBtn = document.getElementById("modalCloseBtn");

    let currentCategory = "all";
    let searchQuery = "";

    // 등록된 게임 수 표시
    const playableCount = GAMES_DATA.filter(g => g.status !== "soon").length;
    headerStats.innerHTML = `플레이 가능한 게임 <strong>${playableCount}</strong>개`;

    // 상태별 버튼 HTML
    function buildActions(game) {
      if (game.status === "ready") {
        return `
          <button class="btn-play" data-play="${game.id}">플레이하기</button>
          <a href="${game.path}" target="_blank" class="btn-external" title="새 창에서 열기">↗</a>`;
      }
      if (game.status === "external") {
        return `<a href="${game.path}" target="_blank" rel="noopener" class="btn-play">새 창에서 플레이 ↗</a>`;
      }
      return `<button class="btn-play" disabled>준비 중</button>`;
    }

    // 게임 카드 렌더링
    function renderGames() {
      grid.innerHTML = "";
      const q = searchQuery.toLowerCase();

      const filtered = GAMES_DATA.filter((game) => {
        const matchCategory = currentCategory === "all" || game.category === currentCategory;
        const matchSearch =
          game.title.toLowerCase().includes(q) ||
          game.desc.toLowerCase().includes(q) ||
          game.tags.some(t => t.toLowerCase().includes(q));
        return matchCategory && matchSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #94a3b8; padding: 40px 0;">조건에 맞는 게임이 없습니다.</p>`;
        return;
      }

      filtered.forEach((game) => {
        const card = document.createElement("div");
        card.className = "game-card" + (game.status === "soon" ? " is-soon" : "");

        const tagsHtml = game.tags.map(t => `<span class="math-tag">${t}</span>`).join("");
        let badge = "";
        if (game.status === "external") badge = `<span class="status-badge">외부 링크</span>`;
        if (game.status === "soon") badge = `<span class="status-badge">준비 중</span>`;

        card.innerHTML = `
          <div class="card-banner ${game.theme || ""}">${game.icon}${badge}</div>
          <div class="card-content">
            <div class="card-header">
              <h3 class="card-title">${game.title}</h3>
              <span class="card-author">${game.author}</span>
            </div>
            <p class="card-desc">${game.desc}</p>
            <div class="tag-container">${tagsHtml}</div>
            <div class="card-actions">${buildActions(game)}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // 플레이 버튼 클릭 (이벤트 위임)
    grid.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-play]");
      if (!btn) return;
      const game = GAMES_DATA.find(g => g.id === btn.dataset.play);
      if (game) openGameModal(game);
    });

    // 모달 제어 함수
    function openGameModal(game) {
      modalTitle.textContent = game.title;
      modalNewTab.href = game.path;
      gameIframe.src = game.path;
      modal.classList.add("active");
    }

    function closeModal() {
      modal.classList.remove("active");
      gameIframe.src = ""; // 게임 오디오/루프 정지
    }

    modalCloseBtn.addEventListener("click", closeModal);
    modal.addEventListener("click", (e) => {
      if (e.target === modal) closeModal();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && modal.classList.contains("active")) closeModal();
    });

    // 카테고리 탭 클릭 이벤트
    categoryTabs.addEventListener("click", (e) => {
      if (!e.target.classList.contains("tab-btn")) return;

      document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
      e.target.classList.add("active");

      currentCategory = e.target.dataset.category;
      renderGames();
    });

    // 검색어 입력 이벤트
    searchInput.addEventListener("input", (e) => {
      searchQuery = e.target.value.trim();
      renderGames();
    });

    // 초기 렌더링
    renderGames();
  </script>
</body>
</html>
